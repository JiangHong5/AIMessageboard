<!DOCTYPE html>
<html>
<head>
    <title>留言板 - Supabase 示例</title>
    <meta charset="utf-8">
    <link rel="stylesheet" href="https://jianghong5.github.io/all_assets/css/viewport.css">
    <style>
        #reply-input-container {
            border: 1px solid #ccc;
            padding: 8px;
            margin: 8px;
            display: flex;
            flex-direction: row;
            justify-content: flex-start;
            align-items: center;
        }
    </style>
</head>
<body>
    <div id="viewport">
        <nav>
            <div id="nav-items">
                <img src="https://jianghong5.github.io/all_assets/img/icon.png" alt="icon" width="52" height="49" class="nav-item" id="icon">
                <span class="nav-item" onclick="window.location.href='https://jianghong5.github.io/index.html'">首页</span>
                <span class="nav-item" onclick="window.location.href='https://jianghong5.github.io/projects.html'">项目</span>
                <span class="nav-item" onclick="window.location.href='https://jianghong5.github.io/blogs/'">博客</span>
            </div>
        </nav>
    </div>
    <div id="container">
        <h2>留言板</h2>
        <div>
            <input type="number" id="group-id" placeholder="群id" value="0">
            <button onclick="enterGroup()">进入群组</button>
            <br>
            <input type="text" id="username" placeholder="你的名字">
            <br>
            <textarea id="content" rows="3" cols="40" placeholder="写点什么..."></textarea>
            <br>
            <button onclick="addReply()">发送</button>
            <button onclick="flushReplies()">刷新</button>
            <button onclick="quitGroup()">退出群组</button>
            <br/>
            <button id="toggle-reply-button" onclick="toggleReplyInputAppearance()">点击开启回复功能</button>
            <div style="display: flex">
                <div id="reply-input-container" style="display: none; ">
                    <p>回复给这条消息：</p>
                    <input type="number" id="reply-input" placeholder="输入数字id">
                </div>
            </div>
            <span id="flush-text"></span>
        </div>
        <hr>
        <span id="group-title"></span>
        <div id="repliesList"></div>
    </div>
    
    <!-- 引入 Supabase JS 客户端（通过 CDN） -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        // 替换为你的 Supabase 项目信息
        const SUPABASE_URL = 'https://fppcxzegwcabshvececw.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_eGbaAhcU3T8XUsbCNc5Ldg_-J5IDR5k';

        const supaabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        
        const flush = document.getElementById("flush-text");
        let group_id = 0;
        let replying = false;

        async function enterGroup() {
            const group_input = document.getElementById("group-id");
            let last_id = group_id;
            group_id = parseInt(group_input.value, 10);
            const { data, error } = await supaabase
                .from("groups")
                .select('*')
                .eq("id", group_id)
            if (error) {
                flush.innerHTML = "进入群组时错误";
                console.log("Error: While entering group " + group_id + ", an error occured: " + error.message);
                group_id = last_id;
                return;
            }
            console.log(data);
            if (data.length != 1) {
                flush.innerHTML = "群组数据异常";
                console.log("Error: Multiple/No data for group " + group_id + ": length is " + data.length);
                group_id = last_id;
                return;
            }
            const data1 = data[0];
            let group_name = data1.group_name;
            const group_title = document.getElementById("group-title");
            flush.innerHTML = "已进入群组：" + group_name;
            group_title.innerHTML = `
            <span style="font-size: 1.5em">
                <strong>${group_name}</strong>
            </span>
            <span style="font-size: small">群号:   ${group_id}</span>
            `;
            loadReplies();
        }
        
        // 加载所有回复，按时间倒序
        async function loadReplies() {
            console.log("load replies");
            if (group_id === null) {
                flush.innerHTML = "请先加入一个群组";
                return 1;
            }
            const { data, error } = await supaabase
                .from("replies")
                .select('*')
                .eq("group_id", group_id)
                .order('created_at', { ascending: false });

            if (error) {
                console.error('加载失败', error);
                flush.innerHTML = "加载失败: " + error.message;
                return 1;
            }

            console.log(data);

            const container = document.getElementById('repliesList');

            console.log("Replies data: " + data.map(rep => `${rep.reply_to ? `<a href="#reply-${rep.reply_to}"><small>回复给: #${rep.reply_to}</small></a><br>` : ''}`).join(""))

            container.innerHTML = data.map(rep => `
                <div id="reply-${rep.id}" style="border:1px solid #ccc; margin:8px; padding:8px;">
                    ${rep.reply_to ? `<a href="#reply-${rep.reply_to}"><small>回复给: #${rep.reply_to}</small></a><br>` : ''}
                    <strong>${escapeHtml(rep.username)}</strong> 
                    <small>${new Date(rep.created_at).toLocaleString()}</small>
                    <p>${escapeHtml(rep.content)}</p>
                    <small>id: ${rep.id}</small>
                </div>
            `).join('');
            return 0;
        }

        // 添加新回复
        async function addReply() {
            const username = document.getElementById('username').value.trim();
            const content = document.getElementById('content').value.trim();
            const reply_to = replying ? parseInt(document.getElementById('reply-input').value.trim(), 10) : null;
            console.log(`reply_to: ${reply_to}`);

            if (!username || !content) {
                alert('请填写姓名和内容');
                return 1;
            }

            if (group_id === null) {
                alert("请先加入一个群组");
                return 1;
            }

            flush.innerHTML = "发送中……";
            
            const { error } = await supaabase
                .from('replies')
                .insert([{ username, content, group_id, reply_to }]);

            if (error) {
                alert('发送失败: ' + error.message);
                console.log("Error: " + error.message);
                flush.innerHTML = "发送失败";
                return 1;
            }
            
            flush.innerHTML = "发送成功";

            const code = loadReplies();
            if (code) {
                flush.innerHTML += "而刷新失败";
                return 1;
            }

            // 清空输入框并刷新列表
            // document.getElementById('username').value = '';
            document.getElementById('content').value = '';
            
        }

        // 简单的防 XSS 函数
        function escapeHtml(str) {
            return str.replace(/[&<>'"]/g, function(m) {
                if (m === '&') return '＆';
                if (m === '<') return '＜';
                if (m === '>') return '＞';
                if (m === "'") return '＇';
                if (m === '"') return '＂';
                return m;
            });
        }

        async function flushReplies() {
            flush.innerHTML = "刷新中……";
            const errorCode = await loadReplies();
            if (errorCode) {
                flush.innerHTML = "刷新失败";
            }
            else {
                flush.innerHTML = "刷新完成";
            }
        }

        function toggleReplyInputAppearance() {
            const container = document.getElementById('reply-input-container');
            const button = document.getElementById('toggle-reply-button');
            replying = !replying;
            container.style.display = replying ? 'flex' : 'none';
            button.textContent = replying ? '点击关闭回复功能' : '点击开启回复功能';
        }

        function quitGroup() {
            group_id = null;
            const groupTitle = document.getElementById("group-title");
            const loadedReplies = document.getElementById("repliesList");
            const flushText = document.getElementById("flush-text");
            groupTitle.textContent = "已退出群组。";
            loadedReplies.innerHTML = "";
            flushText.innerHTML = "";
        }

        enterGroup();
        // 页面加载时显示已有回复
        loadReplies();
    </script>
</body>
</html>
